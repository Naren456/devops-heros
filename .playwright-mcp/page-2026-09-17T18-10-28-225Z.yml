    - generic [ref=e80]:
      - heading "Kubernetes Features" [level=2] [ref=e81]
      - generic [ref=e82]:
        - generic [ref=e83]:
          - heading [level=3] [ref=e84]:
            - link "Automated rollouts and rollbacks" [ref=e85] [cursor=pointer]:
              - /url: /docs/concepts/workloads/controllers/deployment/
          - text: Kubernetes progressively rolls out changes to your application or its configuration, while monitoring application health to ensure it doesn't kill all your instances at the same time. If something goes wrong, Kubernetes will rollback the change for you. Take advantage of a growing ecosystem of deployment solutions.
        - generic [ref=e86]:
          - heading [level=3] [ref=e87]:
            - link "Service discovery and load balancing" [ref=e88] [cursor=pointer]:
              - /url: /docs/concepts/services-networking/service/
          - text: No need to modify your application to use an unfamiliar service discovery mechanism. Kubernetes gives Pods their own IP addresses and a single DNS name for a set of Pods, and can load-balance across them.
        - generic [ref=e89]:
          - heading [level=3] [ref=e90]:
            - link "Storage orchestration" [ref=e91] [cursor=pointer]:
              - /url: /docs/concepts/storage/persistent-volumes/
          - text: Automatically mount the storage system of your choice, whether from local storage, a public cloud provider, or a network storage system such as iSCSI or NFS.
        - generic [ref=e92]:
          - heading [level=3] [ref=e93]:
            - link "Secret and configuration management" [ref=e94] [cursor=pointer]:
              - /url: /docs/concepts/configuration/secret/
          - text: Deploy and update Secrets and application configuration without rebuilding your image and without exposing Secrets in your stack configuration.
        - generic [ref=e95]:
          - heading [level=3] [ref=e96]:
            - link "Automatic bin packing" [ref=e97] [cursor=pointer]:
              - /url: /docs/concepts/configuration/manage-resources-containers/
          - text: Automatically places containers based on their resource requirements and other constraints, while not sacrificing availability. Mix critical and best-effort workloads in order to drive up utilization and save even more resources.
        - generic [ref=e98]:
          - heading [level=3] [ref=e99]:
            - link "Batch execution" [ref=e100] [cursor=pointer]:
              - /url: /docs/concepts/workloads/controllers/job/
          - text: In addition to services, Kubernetes can manage your batch and CI workloads, replacing containers that fail, if desired.
        - generic [ref=e101]:
          - heading [level=3] [ref=e102]:
            - link "Self-healing" [ref=e103] [cursor=pointer]:
              - /url: /docs/concepts/architecture/self-healing/#automated-recovery-from-damage
          - text: Kubernetes restarts containers that crash, replaces entire Pods where needed, reattaches storage in response to wider failures, and can integrate with node autoscalers to self-heal even at the node level.
        - generic [ref=e104]:
          - heading [level=3] [ref=e105]:
            - link "Horizontal scaling" [ref=e106] [cursor=pointer]:
              - /url: /docs/concepts/workloads/autoscaling/horizontal-pod-autoscale/
          - text: Scale your application up and down with a simple command, with a UI, or automatically based on CPU usage.
        - generic [ref=e107]:
          - heading [level=3] [ref=e108]:
            - link "Vertical scaling" [ref=e109] [cursor=pointer]:
              - /url: /docs/concepts/workloads/autoscaling/vertical-pod-autoscale/
          - text: Automatically adjust resource requests and limits based on actual usage patterns.
        - generic [ref=e110]:
          - heading [level=3] [ref=e111]:
            - link "IPv4/IPv6 dual-stack" [ref=e112] [cursor=pointer]:
              - /url: /docs/concepts/services-networking/dual-stack/
          - text: Allocation of IPv4 and IPv6 addresses to Pods and Services
        - generic [ref=e113]:
          - heading [level=3] [ref=e114]:
            - link "Designed for extensibility" [ref=e115] [cursor=pointer]:
              - /url: /docs/concepts/extend-kubernetes/
          - text: Add features to your Kubernetes cluster without changing upstream source code.
