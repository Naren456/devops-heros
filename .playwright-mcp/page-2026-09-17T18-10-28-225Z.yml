      - generic [ref=e48]:
        - paragraph [ref=e49]:
          - link "Kubernetes" [ref=e50] [cursor=pointer]:
            - /url: /docs/concepts/overview/
          - text: ", also known as K8s, is an open source system for automating deployment, scaling, and management of containerized applications."
        - paragraph [ref=e51]:
          - text: It groups containers that make up an application into logical units for easy management and discovery. Kubernetes builds upon
          - link "15 years of experience of running production workloads at Google" [ref=e52] [cursor=pointer]:
            - /url: https://queue.acm.org/detail.cfm?id=2898444
          - text: ", combined with best-of-breed ideas and practices from the community."
      - generic [ref=e55]:
        - heading "Planet scale" [level=4] [ref=e56]
        - paragraph [ref=e57]: Designed on the same principles that allow Google to run billions of containers a week, Kubernetes can scale without increasing your operations team.
      - generic [ref=e60]:
        - heading "Never outgrow" [level=4] [ref=e61]
        - paragraph [ref=e62]: Whether testing locally or running a global enterprise, Kubernetes flexibility grows with you to deliver your applications consistently and easily no matter how complex your need is.
      - generic [ref=e65]:
        - heading "Run K8s anywhere" [level=4] [ref=e66]
        - paragraph [ref=e67]: Kubernetes is open source giving you the freedom to take advantage of on-premises, hybrid, or public cloud infrastructure, letting you effortlessly move workloads to where it matters to you.
