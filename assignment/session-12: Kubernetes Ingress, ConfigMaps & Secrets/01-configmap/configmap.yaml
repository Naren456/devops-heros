apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: s12
data:
  APP_ENV: "production"
  APP_PORT: "8080"
  WELCOME_MSG: "Hello from ConfigMap"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-demo
  namespace: s12
spec:
  replicas: 1
  selector:
    matchLabels: { app: config-demo }
  template:
    metadata:
      labels: { app: config-demo }
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports: [{ containerPort: 80 }]
          envFrom:
            - configMapRef:
                name: app-config
          volumeMounts:
            - name: cfg-vol
              mountPath: /etc/config
              readOnly: true
      volumes:
        - name: cfg-vol
          configMap:
            name: app-config
