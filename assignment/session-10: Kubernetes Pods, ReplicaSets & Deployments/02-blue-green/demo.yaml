apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-blue
  namespace: s10
spec:
  replicas: 2
  selector:
    matchLabels: { app: demo, version: blue }
  template:
    metadata:
      labels: { app: demo, version: blue }
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports: [{ containerPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-green
  namespace: s10
spec:
  replicas: 2
  selector:
    matchLabels: { app: demo, version: green }
  template:
    metadata:
      labels: { app: demo, version: green }
    spec:
      containers:
        - name: web
          image: nginx:stable-alpine
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: demo-svc
  namespace: s10
spec:
  selector: { app: demo, version: blue }  # flip to green to switch traffic
  ports:
    - port: 80
      targetPort: 80
