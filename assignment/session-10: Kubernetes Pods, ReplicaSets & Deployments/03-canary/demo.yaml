apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-stable
  namespace: s10
spec:
  replicas: 3
  selector:
    matchLabels: { app: canary-demo, track: stable }
  template:
    metadata:
      labels: { app: canary-demo, track: stable }
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports: [{ containerPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-canary
  namespace: s10
spec:
  replicas: 1
  selector:
    matchLabels: { app: canary-demo, track: canary }
  template:
    metadata:
      labels: { app: canary-demo, track: canary }
    spec:
      containers:
        - name: web
          image: nginx:stable-alpine
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: canary-svc
  namespace: s10
spec:
  selector: { app: canary-demo }  # matches stable AND canary (~25% to canary)
  ports:
    - port: 80
      targetPort: 80
